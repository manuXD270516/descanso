name: CI

on:
  pull_request:
    branches: [master]
  # Reutilizado por deploy.yml en cada push a master
  workflow_call:

jobs:
  # El nombre "quality" es el check requerido por la protección de master
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — instalar
        working-directory: backend
        run: npm ci
      - name: Backend — lint
        working-directory: backend
        run: npm run lint
      - name: Backend — tests
        working-directory: backend
        run: npm test

      - name: Frontend — instalar
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend — tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Frontend — build de producción
        working-directory: frontend
        run: npx ng build

  # Pruebas end-to-end con Playwright: navegador real contra `node backend/src/server.js`.
  # Corre en paralelo a "quality". No es (todavía) un check requerido por la protección de master,
  # pero al reutilizarse este workflow desde deploy.yml, un fallo aquí también frena el despliegue.
  # Guía: docs/testing/e2e-playwright.md
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Backend — instalar (solo producción)
        working-directory: backend
        run: npm ci --omit=dev
      - name: Frontend — instalar y compilar
        working-directory: frontend
        run: |
          npm ci
          npx ng build
      - name: E2E — instalar
        working-directory: e2e
        run: npm ci
      - name: E2E — typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: E2E — instalar Chromium y dependencias del sistema
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: E2E — ejecutar
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: '1' # el build ya se hizo arriba
        run: npx playwright test

      - name: E2E — subir reporte y trazas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
