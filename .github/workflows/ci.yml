name: CI

on:
  pull_request:
    branches: [master]
  # Reutilizado por deploy.yml en cada push a master
  workflow_call:

jobs:
  # El nombre "quality" es el check requerido por la protección de master
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — instalar
        working-directory: backend
        run: npm ci
      - name: Backend — lint
        working-directory: backend
        run: npm run lint
      - name: Backend — tests
        working-directory: backend
        run: npm test

      - name: Frontend — instalar
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend — tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Frontend — build de producción
        working-directory: frontend
        run: npx ng build
