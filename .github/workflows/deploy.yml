name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Prueba de rollback (SC-003): la versión nueva no arranca'
        type: boolean
        default: false

# Nunca dos despliegues en paralelo; el siguiente espera al actual
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/manuxd270516/descanso

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMAGE_REF: ${{ needs.publish.outputs.image }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://descanso-sleep.fly.dev
    steps:
      - uses: actions/checkout@v4 # fly.toml

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Versión en producción antes de desplegar; sirve para el rollback (también despierta la máquina)
      - name: Versión actual
        id: prev
        run: |
          prev=$(curl -fsS --max-time 30 "$APP_URL/api/health" | jq -r '.version // empty' || true)
          echo "Versión actual: ${prev:-ninguna}"
          echo "version=$prev" >> "$GITHUB_OUTPUT"

      - name: Desplegar la imagen por SHA en Fly.io
        run: |
          extra=()
          if [[ "${{ inputs.simular_fallo }}" == "true" ]]; then extra=(--env NODE_OPTIONS=--require=/no-existe.js); fi
          flyctl deploy --image "$IMAGE_REF" --wait-timeout 5m0s "${extra[@]}"

      - name: Verificar salud y versión (≤ 60 s)
        run: |
          set -euo pipefail
          version=''
          SECONDS=0
          while (( SECONDS <= 60 )); do
            version=$(curl -fsS --max-time 5 "$APP_URL/api/health" | jq -r '.version' || true)
            if [[ "$version" == "$GITHUB_SHA" ]]; then
              echo "Sano con la versión $version tras ${SECONDS} s"; exit 0
            fi
            sleep 5
          done
          echo "El chequeo de salud no devolvió la versión $GITHUB_SHA en 60 s (última: ${version:-sin respuesta})"
          exit 1

      # Fly no vuelve solo a la versión anterior: la redesplegamos para que siga sirviendo (FR-007)
      - name: Rollback a la versión anterior
        if: failure() && steps.prev.outputs.version != '' && steps.prev.outputs.version != 'dev'
        run: |
          echo "Rollback a ${{ steps.prev.outputs.version }}"
          flyctl deploy --image "ghcr.io/manuxd270516/descanso:${{ steps.prev.outputs.version }}" --wait-timeout 5m0s
