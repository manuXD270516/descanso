name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Nunca dos despliegues en paralelo; el siguiente espera al actual
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/manuxd270516/descanso

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMAGE_REF: ${{ needs.publish.outputs.image }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Lanzar el despliegue en Render
        id: hook
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]] && sep='&'
          code=$(curl -sS -o hook.json -w '%{http_code}' -X POST \
            "${RENDER_DEPLOY_HOOK_URL}${sep}imgURL=$(jq -rn --arg v "$IMAGE_REF" '$v|@uri')")
          echo "Deploy hook → HTTP $code"
          if [[ "$code" == "200" ]]; then
            id=$(jq -r '.deploy.id // .id // empty' hook.json)
          elif [[ "$code" == "202" ]]; then
            # Otro despliegue en curso: Render encola este; se toma el más reciente
            sleep 10
            id=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" | jq -r '.[0].deploy.id')
          else
            cat hook.json; exit 1
          fi
          [[ -n "$id" ]] || { echo "No se obtuvo el id del despliegue"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Esperar a que el despliegue esté live
        env:
          DEPLOY_ID: ${{ steps.hook.outputs.id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do   # 90 × 10 s = 15 min
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "$(date -u +%T) $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "Despliegue fallido: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "El despliegue no llegó a live en 15 min"; exit 1

      - name: Verificar salud y versión (≤ 60 s)
        run: |
          set -euo pipefail
          version=''
          SECONDS=0
          while (( SECONDS <= 60 )); do
            version=$(curl -fsS --max-time 5 "$APP_URL/api/health" | jq -r '.version' || true)
            if [[ "$version" == "$GITHUB_SHA" ]]; then
              echo "Sano con la versión $version tras ${SECONDS} s"; exit 0
            fi
            sleep 5
          done
          echo "El chequeo de salud no devolvió la versión $GITHUB_SHA en 60 s (última: ${version:-sin respuesta})"
          exit 1
