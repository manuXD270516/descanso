# Fly.io — servicio único (API + frontend) con SQLite en un volumen persistente.
# La imagen la publica .github/workflows/deploy.yml en GHCR; el pipeline despliega por SHA.
app = "descanso-sleep"
primary_region = "gru"

[build]
  image = "ghcr.io/manuxd270516/descanso:latest"

[env]
  DB_PATH = "/data/sleep.db"
  PORT = "3000"

# Volumen creado una vez con: fly volumes create descanso_data --size 1 --region gru
[[mounts]]
  source = "descanso_data"
  destination = "/data"

# Máquina siempre encendida (feature 013, avisos push): el disparador de avisos vive dentro del servicio y
# necesita estar en marcha a la hora de cada aviso, así que la máquina ya no se apaga sin tráfico.
# Coste ≈ 3,3 $/mes en total (≈ 3,1 $ de cómputo shared-cpu-1x de 256 MB en gru + 0,15 $ del volumen), ≈ 1–1,5 $
# más que con auto-stop. Decisión del owner (P5b); ver specs/013-avisos-push/plan.md (Complexity Tracking).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

# Una sola máquina con volumen: se actualiza en el sitio y flyctl espera a los health checks.
# Si la versión nueva no queda sana, el pipeline redespliega la anterior (rollback).
[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
