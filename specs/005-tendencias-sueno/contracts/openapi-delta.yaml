openapi: 3.1.0
info:
  title: Descanso API — cambios de la feature 005
  version: 1.5.0
  description: |
    Cambios sobre los contratos de 001–008. Todo con sesión y aislado por usuario (008).
servers:
  - url: /api

paths:
  /dashboard:
    get:
      summary: Tendencias del usuario (FR-001…FR-006, FR-009)
      parameters:
        - name: days
          in: query
          required: true
          schema: { enum: [7, 30, 90] }
        - name: to
          in: query
          required: true
          description: Fecha de la noche de hoy del cliente (AAAA-MM-DD); no posterior a hoy + 1 día (UTC)
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [goal_min, cycle_min, period, days, summary, pending14, regularity, cycles]
                properties:
                  goal_min: { type: integer, minimum: 240, maximum: 720 }
                  cycle_min: { type: integer, const: 90, description: 'Hasta 006: duración de ciclo usada en las sugerencias' }
                  period:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      days: { enum: [7, 30, 90] }
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, status, night_min, nap_min, total_min]
                      properties:
                        date: { type: string, format: date }
                        status: { enum: [data, none, in_progress] }
                        night_min: { type: [integer, 'null'] }
                        nap_min: { type: [integer, 'null'] }
                        total_min: { type: [integer, 'null'], description: 'null = sin dato (nunca 0 por falta de registro)' }
                  summary:
                    type: object
                    properties:
                      avg_min: { type: [integer, 'null'] }
                      days_with_data: { type: integer }
                      goal_met: { type: integer, description: 'Días con total ≥ objetivo' }
                  pending14:
                    type: object
                    description: 'Neto de los últimos 14 días que terminan en `to`: goal × days − total'
                    properties:
                      net_min: { type: [integer, 'null'], description: 'null si no hay días registrados; negativo = de más' }
                      days: { type: integer }
                  regularity:
                    oneOf:
                      - type: 'null'
                        description: Menos de 7 noches cerradas en el periodo
                      - type: object
                        properties:
                          nights: { type: integer, minimum: 7 }
                          bedtime: { $ref: '#/components/schemas/CircularStat' }
                          wake: { $ref: '#/components/schemas/CircularStat' }
                  cycles:
                    type: object
                    properties:
                      equivalent: { type: number, description: 'goal_min / cycle_min, con 1 decimal' }
                      shortcuts:
                        type: array
                        items: { type: object, properties: { cycles: { type: integer }, minutes: { type: integer } } }
        '400': { description: 'days o to inválidos ("El periodo debe ser 7, 30 o 90 días" / "Fecha inválida")' }

  /me:
    get:
      summary: Igual que en 008; añade goal_customized y onboarded_at
    put:
      summary: Igual que en 008; fijar sleep_goal_min marca goal_customized = 1 (FR-007)

  /me/onboarding:
    post:
      summary: Bienvenida vista (FR-010); opcionalmente fija el objetivo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sleep_goal_min: { type: integer, minimum: 240, maximum: 720 }
      responses:
        '200': { description: Perfil actualizado con onboarded_at }
        '400': { description: Objetivo fuera de rango }

  /auth/status:
    get:
      summary: En "authenticated" añade onboarded (bool)
  /auth/login:
    post:
      summary: La respuesta añade onboarded (bool)

components:
  schemas:
    CircularStat:
      type: object
      properties:
        mean_min: { type: integer, minimum: 0, maximum: 1439 }
        spread_min: { type: integer, minimum: 0, description: 'Desviación circular en minutos (±)' }
